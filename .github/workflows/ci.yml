name: CI

# Gerbang sebelum push menjangkau produksi.
#
# Mengapa ini ada: deploy mengikuti push (followsPushes), jadi sebelum CI ada,
# satu kegagalan `tsc` atau satu uji merah langsung menjadi produksi yang mati
# di blitz sampai ada hotfix. Dengan gerbang ini, kegagalan berhenti di GitHub.
#
# Sengaja sederhana: tanpa caching, tanpa matriks versi. Kompleksitas pipeline
# yang tidak terpelihara lebih berbahaya daripada menit-build yang lebih lama.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi
        run: npm ci
        working-directory: backend
      - name: Periksa tipe
        run: npm run typecheck
        working-directory: backend
      - name: Uji
        run: npm run test
        working-directory: backend
      # Informatif, bukan gerbang: temuan di dependensi transitif sering belum
      # punya perbaikan, dan memerahkan CI karenanya membuat tim terbiasa
      # mengabaikan CI. Hasilnya tetap terlihat di log.
      - name: Audit dependensi produksi
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend
        continue-on-error: true

  # Deploy memakai Dockerfile ini langsung (blitz.cloud). Tanpa langkah ini,
  # Dockerfile yang rusak baru ketahuan SETELAH push menjangkau produksi.
  backend-image:
    name: Backend (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bangun image (tanpa push)
        run: docker build --platform linux/amd64 -t fayln-backend:ci .
        working-directory: backend

  frontend:
    name: Frontend (tsc + jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi
        run: npm ci
        working-directory: frontend
      - name: Periksa tipe
        run: npm run typecheck
        working-directory: frontend
      - name: Uji
        run: npm run test
        working-directory: frontend
      - name: Audit dependensi produksi
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
        continue-on-error: true
