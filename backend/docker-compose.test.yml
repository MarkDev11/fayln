# Verifikasi lokal backend fayLN.
#
# Tujuan: membuktikan bahwa image yang dibangun dari Dockerfile benar-benar
# berjalan bersama PostgreSQL sungguhan — bukan hanya lolos pengujian in-memory.
#
# Pakai:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#   docker compose -f docker-compose.test.yml down -v
#
# Ini BUKAN berkas untuk blitz.cloud. Di sana aplikasi dibangun langsung dari
# Dockerfile dan database disediakan sebagai layanan terkelola.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fayln
      POSTGRES_PASSWORD: fayln
      POSTGRES_DB: fayln
    # Sengaja tidak memetakan port ke host: hanya aplikasi yang perlu menjangkaunya.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fayln -d fayln']
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      # Data uji tidak perlu bertahan; ini juga membuat pengujian lebih cepat.
      - /var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Sama seperti yang dibutuhkan blitz.cloud.
      platforms:
        - linux/amd64
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      # blitz.cloud menyuntikkan PORT; di sini kita menirunya.
      PORT: '8080'
      DATABASE_URL: postgres://fayln:fayln@db:5432/fayln
      RUN_MIGRATIONS_ON_START: 'true'
      FREE_DAILY_TOKENS: '100000'
    ports:
      # Hanya untuk memeriksa dari mesin ini.
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health/ready')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: 'no'
